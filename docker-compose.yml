services:
  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - NEXT_PUBLIC_WS_URL=ws://backend:8080/ws
    depends_on:
      - backend
    networks:
      - livelingo
    restart: unless-stopped

  backend:
    build:
      context: ./web/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/livelingo
      - PORT=8080
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - livelingo
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=livelingo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./web/backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - livelingo
    restart: unless-stopped

networks:
  livelingo:
    driver: bridge

volumes:
  postgres_data:
