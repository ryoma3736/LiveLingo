name: LiveLingo
options:
  bundleIdPrefix: com.livelingo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  Dependencies:
    url: https://github.com/pointfreeco/swift-dependencies
    from: "1.0.0"
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    from: "1.0.0"
  Collections:
    url: https://github.com/apple/swift-collections
    from: "1.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  LiveLingo:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Resources
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Dependencies
        product: Dependencies
      - package: AsyncAlgorithms
        product: AsyncAlgorithms
      - package: Collections
        product: Collections
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livelingo.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveLingo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
    info:
      path: Resources/Info.plist
    entitlements:
      path: LiveLingo.entitlements

  LiveLingoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: tests/UnitTests
        excludes:
          - "**/.DS_Store"
          - "*.ts"
    dependencies:
      - target: LiveLingo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.livelingo.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LiveLingo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LiveLingo"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LiveLingo:
    build:
      targets:
        LiveLingo: all
        LiveLingoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiveLingoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
